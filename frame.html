<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>FEI · HEL — viewport preview</title>
<style>
  html, body { margin: 0; padding: 0; background: #ddd; }
  iframe { border: 0; display: block; background: #fff; margin: 0 auto; }
</style>
</head>
<body>
<script>
  var p = new URLSearchParams(location.search);
  var w = parseInt(p.get("w") || "390", 10);
  var h = parseInt(p.get("h") || "844", 10);
  var q = p.get("q") || "?lang=en";
  var hash = p.get("h2") ? "#" + p.get("h2") : "";
  var f = document.createElement("iframe");
  f.width = w;
  f.height = h;
  f.style.width = w + "px";
  f.style.height = h + "px";
  f.src = "./index.html" + q + hash;
  document.body.appendChild(f);
</script>
</body>
</html>
