<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>FEI · HEL — preview frame (verification only)</title>
<style>
  html, body { margin: 0; padding: 0; background: #dcdad2; }
  iframe { display: block; border: 0; background: #faf9f5; }
</style>
</head>
<body>
<script>
  var q = new URLSearchParams(location.search);
  var w = parseInt(q.get('w') || '1440', 10);
  var h = parseInt(q.get('h') || '900', 10);
  var y = parseInt(q.get('y') || '0', 10);
  var lang = q.get('lang') || '';
  var frame = document.createElement('iframe');
  frame.width = w;
  frame.height = h;
  frame.style.width = w + 'px';
  frame.style.height = h + 'px';
  frame.src = './' + (lang ? '?lang=' + encodeURIComponent(lang) : '');
  frame.addEventListener('load', function () {
    setTimeout(function () {
      try { frame.contentWindow.scrollTo(0, y); } catch (e) {}
    }, 250);
  });
  document.body.appendChild(frame);
</script>
</body>
</html>
