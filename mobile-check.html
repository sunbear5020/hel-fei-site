<!doctype html>
<html lang="ko">
<head><meta charset="utf-8" /><title>mobile check</title>
<style>body{margin:0;background:#dddddd;font:12px system-ui}iframe{width:390px;height:844px;border:0;display:block;margin:16px}</style>
</head>
<body>
<iframe id="phone" src="./?v=4&lang=ko#media" title="mobile 390"></iframe>
<script>
  var f = document.getElementById('phone');
  f.addEventListener('load', function () {
    try {
      var d = f.contentDocument;
      var target = d.getElementById('media');
      if (target) target.scrollIntoView();
    } catch (e) {}
  });
</script>
</body>
</html>
